name: CI
permissions:
  contents: read


on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt

      - name: Run backend API smoke
        run: python scripts/smoke_backend_api.py

      - name: Run backend status smoke
        run: python scripts/smoke_backend_status.py

      - name: Run backend schema smoke
        run: python scripts/smoke_backend_schema.py

      - name: Run backend report concurrency smoke
        run: python scripts/smoke_backend_concurrency.py

      - name: Run backend report lifecycle smoke
        run: python scripts/smoke_backend_lifecycle.py

      - name: Run backend privacy abuse smoke
        run: python scripts/smoke_backend_privacy_abuse.py

      - name: Guard repo hygiene
        run: bash scripts/repo_guard.sh --no-build

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run frontend static smoke
        run: python scripts/smoke_frontend_static.py

      - name: Run Docker Compose smoke
        run: bash scripts/smoke_docker_compose.sh
